<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projets LFI publics — 3ᵉ circonscription de l'Aude</title>
<style>
:root { --charbon:#1c1c22; --creme:#f7f2e8; --rouge:#c33b2e; }
body { font-family:'Public Sans',system-ui,sans-serif; background:var(--creme); color:var(--charbon); margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
main { max-width:560px; padding:2.5rem; }
h1 { font-size:1.5rem; margin:0 0 .5rem; }
p.sous-titre { margin:0 0 2rem; opacity:.75; }
a.carte { display:block; padding:1.2rem 1.5rem; border:2px solid var(--charbon); border-radius:12px; text-decoration:none; color:var(--charbon); background:#fff; transition:transform .12s ease, box-shadow .12s ease; }
a.carte:hover { transform:translateY(-2px); box-shadow:4px 6px 0 var(--rouge); }
a.carte strong { display:block; font-size:1.05rem; color:var(--rouge); }
a.carte span { font-size:.92rem; opacity:.8; }
</style>
</head>
<body>
<main>
<h1>Projets LFI publics</h1>
<p class="sous-titre">3ᵉ circonscription de l'Aude</p>
<a class="carte" href="carte-attribution/">

<span>Carte interactive pour répartir les territoires d'action entre les groupements, avec agenda.</span>
</a>
</main>

</html>
